
name: Build and Release

on:
  push:
    branches:
      - custom-1.3.53

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          always-auth: true
          scope: '@factfield-gmbh'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Generate a unique package version from package.json and commit id
        id: get_version
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$(node -p 'require("./package.json").version')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set package version from env
        run: npm version $PACKAGE_VERSION --no-git-tag-version
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
